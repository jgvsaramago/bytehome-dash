# reSpeaker XVF3800 (USB): channel 0 is the processed voice signal (echo
# cancelled against the board's own speaker output, beamformed); 2-5 are the
# raw mics. Exposes channel 0 alone as the mono "respeaker_voice" mic.
# Installed by setup.sh to ~/.config/pipewire/pipewire.conf.d/ with @SOURCE@
# set to the reSpeaker's PipeWire source.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "reSpeaker Voice"
      capture.props = {
        node.name = "respeaker_voice_capture"
        target.object = "@SOURCE@"
        audio.position = [ FL ]
        stream.dont-remix = true
        node.passive = true
      }
      playback.props = {
        node.name = "respeaker_voice"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
